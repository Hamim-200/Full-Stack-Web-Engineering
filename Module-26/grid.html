<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- FONT awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <h2 class="text-3xl font-semibold text-center m-8 bg-amber-50 border p-3  font-serif">Grid Layout</h2>

    <!-- <div class="my-8 grid md:grid-cols-2 xl:grid-cols-3 gap-5"> -->
    <div class="my-8 grid grid-cols-1 md:grid-cols-12 gap-4">
        <div
            class="h-34 w-full  bg-amber-400 rounded-2xl  border-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-3">
            CARD-1
        </div>
        <div
            class="h-34 w-full  bg-amber-400 rounded-2xl  border-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-2">
            CARD-2
        </div>
        <div
            class="h-34 w-full  bg-amber-400 rounded-2xl  border-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-5">
            CARD-3
        </div>
        <div
            class="h-34 w-full  bg-amber-400 rounded-2xl  border-4 flex justify-center items-center font-bold text-3xl col-span-1 md:col-span-2">
            CARD-4
        </div>

    </div>
</body>

</html>
