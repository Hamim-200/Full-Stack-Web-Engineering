<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module-30</title>

    <style>
        .box {
            height: 30px;
            width: 30px;
            border: 2px solid red;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <h2 id="new" class="newCls">My Changing DOM</h2>
    <img id="img" src="newImg" alt="">

    <script>
        const change = document.querySelector("#new")


        // change content and text content
        console.log(change.textContent);
        console.log(change.innerHTML);
        console.log(change.innerText);


        change.textContent = "Hi DHAK"

        // modify Attribute 
        console.log(change.getAttribute("class")) // newCls

        const img = document.querySelector("#img")
        console.log(img.getAttribute("src"))

        img.setAttribute("src", "https://images.unsplash.com/photo-1520209759809-a9bcb6cb3241?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1nfGVufDB8fDB8fHww")

        img.style.height = "200px";
        img.style.width = "200px";


        // add style using css
        // img.classList.add("box")

        // Toggle 
        img.classList.toggle("box") // Add style
        img.classList.toggle("box") // Remove Style

    </script>

</body>

</html>
