
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
        }

        #user-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
        }

        .user-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .user-card h2 {
            color: #2563eb;
            margin-top: 0;
        }

        .user-card p {
            color: #374151;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .user-card a {
            color: #2563eb;
        }
    </style>
</head>
<body>

    <h1>User Information</h1>

    <div id="user-container">Loading users...</div>


    <script src="promis.js"></script>
</body>
</html>
