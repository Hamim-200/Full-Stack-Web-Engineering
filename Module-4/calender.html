<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>July Calender</title>
    <style>
        body{
            max-width: 1000px;
            border: 2px solid rgb(188, 35, 35);
            margin: 40px auto;
        }
        h3{
            text-align: center;
            font-weight: 900;
            font-size: 2rem;
            color: darkred;
            margin: 20px;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(7,1fr);
        }
        .box{
            background: #950e0e;
            padding: 20px;
            border: 1px solid rgb(15, 3, 2);
            margin: 10px;
            text-align: center;
            color: white;
        }
        .box-1{
            background-color: rgb(92, 4, 1);
            padding: 20px;
            border: 1px solid rgb(15, 3, 2);
            margin: 10px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <h3>JULY 2026</h3>
    <div class="container">
        <div class="box-1">Wed</div>
        <div class="box-1">Thur</div>
        <div class="box-1">Fri</div>
        <div class="box-1">Sat</div>
        <div class="box-1">Sun</div>
        <div class="box-1">Mon</div>
        <div class="box-1">Tue</div>
        <div class="box">1 July</div>
        <div class="box">2 July</div>
        <div class="box">3 July</div>
        <div class="box">4 July</div>
        <div class="box">5 July</div>
        <div class="box">6 July</div>
        <div class="box">7 July</div>
        <div class="box">8 July</div>
        <div class="box">9 July</div>
        <div class="box">10 July</div>
        <div class="box">11 July</div>
        <div class="box">12 July</div>
        <div class="box">13 July</div>
        <div class="box">14 July</div>
        <div class="box">15 July</div>
        <div class="box">16 July</div>
        <div class="box">17 July</div>
        <div class="box">18 July</div>
        <div class="box">19 July</div>
        <div class="box">20 July</div>
        <div class="box">21 July</div>
        <div class="box">22 July</div>
        <div class="box">23 July</div>
        <div class="box">24 July</div>
        <div class="box">25 July</div>
        <div class="box">26 July</div>
        <div class="box">27 July</div>
        <div class="box">28 July</div>
        <div class="box">29 July</div>
        <div class="box">30 July</div>
        <div class="box">31 July</div>
    </div>
</body>
</html>
