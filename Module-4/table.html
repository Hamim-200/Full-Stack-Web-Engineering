<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Table Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 40px;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            text-align: center;
            background: white;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
        }

        th,
        td {
            border: 1px solid #1e1c1c;
            padding: 12px;
        }
    </style>

</head>

<body>

    <table>

        <!-- Table Title -->
        <caption>Office Information</caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Position</th>
                <th>Office</th>
                <th>Salary</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>

            <tr>
                <td>101</td>
                <td>Emon</td>
                <td>CEO</td>
                <td>Summer 2026</td>
                <td>1000/=</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Ashik</td>
                <td rowspan="2">COO</td>
                <td>Spring 2026</td>
                <td>750/=</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Rafi</td>
                <td>Fall 2025</td>
                <td>600/=</td>
            </tr>

            <tr>
                <td>104</td>
                <td colspan="2">Executive Team</td>
                <td>Summer 2026</td>
                <td>500/=</td>
            </tr>

        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="5">
                    Total Employee: 4
                </td>
            </tr>
        </tfoot>

    </table>

</body>

</html>
